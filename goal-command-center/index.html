<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Goal Command Center — goals, milestones, habits, daily actions and check-ins." />
  <title>Goal Command Center</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">G</div>
        <div><strong>Goal Command</strong><span>Center</span></div>
      </div>

      <nav class="nav" aria-label="Primary">
        <button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button>
        <button class="nav-item" data-view="goals">◎ <span>Goals</span></button>
        <button class="nav-item" data-view="today">✓ <span>Today</span></button>
        <button class="nav-item" data-view="habits">↻ <span>Habits</span></button>
        <button class="nav-item" data-view="checkin">✎ <span>Check-in</span></button>
      </nav>

      <div class="sidebar-footer">
        <button id="installBtn" class="ghost-btn hidden">Install app</button>
        <button class="ghost-btn" data-view="settings">Settings</button>
        <div class="sync-pill" id="syncStatus"><span class="dot"></span> Local mode</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="todayLabel"></p>
          <h1 id="viewTitle">Command Center</h1>
        </div>
        <div class="top-actions">
          <button id="quickAddBtn" class="secondary-btn">+ Quick action</button>
          <button id="addGoalBtn" class="primary-btn">+ New goal</button>
        </div>
      </header>

      <section id="dashboardView" class="view active"></section>
      <section id="goalsView" class="view"></section>
      <section id="todayView" class="view"></section>
      <section id="habitsView" class="view"></section>
      <section id="checkinView" class="view"></section>
      <section id="settingsView" class="view"></section>
    </main>
  </div>

  <div id="modalRoot" class="modal-root hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
